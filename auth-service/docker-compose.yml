# docker-compose.yml (use this to avoid host-volume mount)
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 01713447728
    volumes:
      - db_auth_data:/var/lib/postgresql/data
    ports:
      - '5433:5432'

  web:
    build:
      context: .
    # We removed host volume mount to avoid mount/sharing issues.
    command: bash -c "until nc -z db 5432; do echo 'Waiting for db...'; sleep 1; done; python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    ports:
      - '8001:8000'
    env_file:
      - .env
    depends_on:
      - db

volumes:
  db_auth_data:
