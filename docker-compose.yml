# version: "3.8"

services:
  redis:
    image: redis:7
    restart: unless-stopped
    ports: ["6379:6379"]
  auth-db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "01713447728"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Uncomment to expose DB to host (for tooling); avoid in prod if not needed
    ports:
      - "5433:5432"

  company-db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-companydb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-01713447728}
    volumes:
      - company_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5434:5432"

  auth-web:
    build:
      context: ./auth-service
    container_name: auth-service   # optional: remove if you want Compose-managed names
    restart: unless-stopped
    command: >
      bash -c "until nc -z auth-db 5432; do echo 'Waiting for auth-db...'; sleep 1; done;
               python manage.py migrate --noinput &&
               python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8001:8000"
    env_file:
      - ./auth-service/.env
    depends_on:
      - auth-db
      - redis
    volumes:
      - ./auth-service:/usr/src/app   # useful for development; remove for production

  company-web:
    build:
      context: ./company-service
    container_name: company-service
    restart: unless-stopped
    command: >
      bash -c "until nc -z company-db 5432; do echo 'Waiting for company-db...'; sleep 1; done;
               python manage.py migrate --noinput &&
               python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8002:8000"
    env_file:
      - ./company-service/.env
    depends_on:
      - company-db
      - redis
      - auth-web
    volumes:
      - ./company-service:/usr/src/app
  audit-worker:
    build: ./auth-service
    command: celery -A auth_service.celery_app worker --loglevel=info --concurrency=1
    env_file:
      - ./auth-service/.env
    depends_on:
      - redis
      - auth-db  

volumes:
  auth_db_data:
  company_db_data:
